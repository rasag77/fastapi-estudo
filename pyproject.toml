[project]
name = "fast-one"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.15,<4.0"
dependencies = [
    "fastapi[standard] (>=0.162.4,<0.163.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]


[tool.ruff]
line-length = 79
extend-exclude = ['migrations']
indent-width = 4


[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']


[tool.ruff.format]
preview = true
quote-style = 'single'
indent-style = "tab"


[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'



[tool.taskipy.tasks]
lint = 'ruff check'
format = 'ruff format'
run = 'fastapi dev fast_one/app.py'
test = 'pytest -s -x --cov=fast_one -vv'
pre_format = 'ruff check --fix'
pre_test = 'task lint'
post_test = 'coverage html'


